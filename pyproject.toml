[tool.poetry]
name = "axo_endpoint"
version = "0.1.0"
description = ""
authors = ["Ignacio Castillo <ignacio.bcastillo@gmail.com>"]
readme = "README.md"


[tool.poetry.scripts]
axo-endpoint         = "axo_endpoint.cli:main"
axo-endpoint-client  = "axo_endpoint.client_cli:main"
axec                 = "axo_endpoint.client_cli:main"

[tool.poetry.dependencies]
python = ">=3.10,<4"
numpy  = ">=1.26,<1.27"
pyzmq = "^26.0.3"
cloudpickle = "^3.0.0"
aiofiles = "^23.2.1"
# activex="0.0.21"


python-dotenv = "^1.0.1"



cryptography = "42.0.5"
pika = "^1.3.2"
matplotlib = "3.9.2"
pillow = "^11.3.0"
axo = "0.0.4a3"
rich = "^15.0.0"
docker = "^7.1.0"
fastapi = "^0.115.0"
uvicorn = {version = "^0.34.0", extras = ["standard"]}
requests = "^2.32.0"
pandas = {version = "^2.2", optional = true}
axo_shared = {path = "axo_shared", develop = true}
xolo = {version = "0.1.0a4", source = "test"}

[tool.poetry.extras]
pandas = ["pandas"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
galois = "^0.3.9"
pytest-asyncio = "^1.1.0"
rory = "0.1.10"
pytest-cov = "^7.1.0"





[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "test"
url = "https://test.pypi.org/simple/"
priority = "supplemental"

